[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xrdcheck"
version = "0.8.0"
description = "XRD 비정질 판정 도우미 — halo 피팅과 결정 피크 검출"
authors = [{ name = "KIM YEONGDO" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "PySide6>=6.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]
build = ["pyinstaller>=6.10"]
cards = ["pymatgen>=2024.1"]  # tools/make_phase_cards.py(상 카드 계산)만 — 프로그램에는 필요 없음

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
xrdcheck = ["data/*.json", "data/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # matplotlib Qt 백엔드 내부의 폐기 예정 Qt 옵션 사용(우리 코드와 무관)
    "ignore:Enum value .Qt..ApplicationAttribute.AA_UseHighDpiPixmaps:DeprecationWarning",
]
